[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-router"
version = "0.1.0"
description = "Pluggable LLM inference routing SDK — bring any model from any provider"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "anyio>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "boto3>=1.34",
    "anthropic>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inference_router*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"